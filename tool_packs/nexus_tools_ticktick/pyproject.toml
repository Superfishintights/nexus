[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-tools-ticktick"
version = "0.1.0"
description = "Nexus TickTick Open API tasks, projects, habits and focus tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nexus-core>=0.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_tools_ticktick*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]
